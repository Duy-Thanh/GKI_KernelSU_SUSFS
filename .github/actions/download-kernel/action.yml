name: 'Download Kernel Repository'
description: 'Initialize and sync Android kernel source repository'

inputs:
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.15, 6.1)'
    required: true
  version:
    description: 'Combined version (e.g., android14-6.1)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-01)'
    required: true
  manifest_url:
    description: 'Custom manifest URL (default: https://android.googlesource.com/kernel/manifest)'
    required: false
    default: 'https://android.googlesource.com/kernel/manifest'
  github_token:
    description: 'GitHub token for private repo access (default: GITHUB_TOKEN)'
    required: false
    default: ''

outputs:
  deprecated_branch:
    description: 'Whether the kernel branch is deprecated'
    value: ${{ steps.sync.outputs.deprecated }}
  tag_fallback:
    description: 'Release tag used when the branch head was missing upstream'
    value: ${{ steps.sync.outputs.tag_fallback }}

runs:
  using: composite
  steps:
    - name: Initialize and Sync Kernel Repository
      id: sync
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # Derive android and kernel from combined version when available
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
        FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${{ inputs.os_patch_level }}"

        init_repo() {
          local depth="$1"
          local depth_flag=""
          if [ "$depth" != "0" ]; then
            depth_flag="--depth=${depth}"
          fi
          MANIFEST_URL="${{ inputs.manifest_url }}"
          GITHUB_TOKEN="${{ inputs.github_token }}"
          
          # If github_token is provided, force git to use insteadOf for all github.com URLs
          if [ -n "$GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "[*] Configured Git insteadOf rule with GitHub token"
          fi
          
          repo init -u "${MANIFEST_URL}" -b common-${FORMATTED_BRANCH} ${depth_flag} || { echo "ERROR: repo init failed" >&2; return 1; }
          # Extract kernel common URL from manifest URL (replace /manifest with /common)
          KERNEL_COMMON_URL="${MANIFEST_URL%/manifest}/common"
          REMOTE_BRANCH=$(git ls-remote "${KERNEL_COMMON_URL}" ${FORMATTED_BRANCH}) || { echo "ERROR: git ls-remote failed" >&2; return 1; }
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          DEPRECATED=false
          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" "$DEFAULT_MANIFEST_PATH"
            echo "[!] Note: Branch ${FORMATTED_BRANCH} is considered deprecated."
            DEPRECATED=true
          fi
          echo "deprecated=$DEPRECATED" >> $GITHUB_OUTPUT

          TAG_FALLBACK=""
          if [ "$DEPRECATED" = "false" ] && [ -z "$REMOTE_BRANCH" ]; then
            LATEST_TAG=$(git ls-remote "${KERNEL_COMMON_URL}" "refs/tags/${FORMATTED_BRANCH}_r*" 2>/dev/null | awk '{print $2}' | grep -v '\^{}$' | sed 's|refs/tags/||' | awk -F'_r' '{print $NF+0, $0}' | sort -n | tail -n 1 | cut -d' ' -f2- || true)
            if [ -n "$LATEST_TAG" ]; then
              echo "[!] Note: Branch ${FORMATTED_BRANCH} head missing upstream; using tag ${LATEST_TAG}."
              sed -i "/path=\"common\"/ s|revision=\"${FORMATTED_BRANCH}\"|revision=\"refs/tags/${LATEST_TAG}\"|" "$DEFAULT_MANIFEST_PATH"
              TAG_FALLBACK="$LATEST_TAG"
            else
              echo "WARNING: no head or tag found for ${FORMATTED_BRANCH}; sync will likely fail." >&2
            fi
          fi
          echo "tag_fallback=$TAG_FALLBACK" >> $GITHUB_OUTPUT
        }

        MAX_RETRIES=5
        SYNC_TIMEOUT="15m"
        RETRY_DELAYS=(15 30 60 120 240)
        attempt=1
        DEPTHS=(1 1 1 1 1)

        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=http.lowSpeedLimit
        export GIT_CONFIG_VALUE_0=1024
        export GIT_CONFIG_KEY_1=http.lowSpeedTime
        export GIT_CONFIG_VALUE_1=60

        clean_workspace() {
          echo "Disk before cleanup:"
          df -h "$PWD" | tail -n +2 || true
          find "$PWD" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          echo "Disk after cleanup:"
          df -h "$PWD" | tail -n +2 || true
        }

        while [ $attempt -le $MAX_RETRIES ]; do
          CURRENT_DEPTH="${DEPTHS[$((attempt-1))]}"
          echo "Attempt $attempt/$MAX_RETRIES: initialize and sync kernel repository (depth=${CURRENT_DEPTH}, sync timeout $SYNC_TIMEOUT, stall abort: <1KB/s for 60s)..."
          df -h "$PWD" | tail -n +2 || true
          if init_repo "$CURRENT_DEPTH"; then
            SYNC_TAG_FLAGS="--no-tags"
            if [ -n "$TAG_FALLBACK" ]; then SYNC_TAG_FLAGS=""; fi
            if timeout $SYNC_TIMEOUT repo sync -c --current-branch --no-clone-bundle $SYNC_TAG_FLAGS --jobs-checkout=4 -j4; then
              echo "Kernel repository initialization and sync succeeded on attempt $attempt."
              break
            else
              rc=$?
              if [ $rc -eq 124 ]; then
                echo "repo sync timed out after $SYNC_TIMEOUT (no stall-abort fired: transfer was progressing, just slow)."
              else
                echo "repo sync failed with exit code $rc."
              fi
            fi
          else
            rc=$?
            echo "repo init or branch preflight failed with exit code $rc."
          fi

          if [ $attempt -lt $MAX_RETRIES ]; then
            DELAY="${RETRY_DELAYS[$((attempt-1))]}"
            echo "Cleaning workspace and retrying after ${DELAY}s..."
            clean_workspace || true
            sleep "$DELAY"
          else
            echo "All $MAX_RETRIES attempts failed." >&2
            exit $rc
          fi
          attempt=$((attempt+1))
        done

    - name: Capture Kernel Common Commit Metadata
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        if [[ ! -d common ]]; then
          echo "WARNING: common folder not found; skipping commit metadata capture."
          exit 0
        fi

        cd common

        if [[ ! -d .git ]]; then
          echo "WARNING: common is not a git checkout; skipping commit metadata capture."
          exit 0
        fi

        COMMIT_DATE=$(git log -1 --format=%cI)
        COMMIT_MSG=$(git log -1 --format=%s)
        COMMIT_SHA=$(git rev-parse HEAD)

        echo "KERNEL_SOURCE_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"
        echo "Kernel common commit date: $COMMIT_DATE"
        echo "Kernel common commit msg: $COMMIT_MSG"
        echo "Kernel common commit SHA: $COMMIT_SHA"
 
